name: Eden build check

# Compiles Eden on every push/PR so platform build problems show up here
# instead of on a tester's machine. This is a build check only - it publishes
# nothing (see eden-release.yml for publishing).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove any stale build folder from the checkout
        # build/ must never come from git (a CMakeCache.txt from another machine
        # makes CMake refuse to configure). Always start clean.
        run: rm -rf build
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libvulkan-dev glslang-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    # Not yet proven in CI - a setup hiccup here shouldn't hide a real result
    # from the other jobs. Read this job's log either way.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Remove any stale build folder from the checkout
        # build/ must never come from git (a CMakeCache.txt from another machine
        # makes CMake refuse to configure). Always start clean.
        shell: pwsh
        run: Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue; exit 0
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          # Pinned: 'latest' can move under us, and 'stripdown' may remove the
          # shader compiler CMake needs.
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
      - name: Show build tools
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"
          Get-Command glslangValidator, glslc -ErrorAction SilentlyContinue | Format-Table Name, Source
          glslangValidator --version
          cmake --version
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 2>&1 | Tee-Object -FilePath configure-log.txt
          exit $LASTEXITCODE
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          exit $LASTEXITCODE
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            configure-log.txt
            build-log.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  macos:
    name: macOS (Clang + MoltenVK)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Remove any stale build folder from the checkout
        # build/ must never come from git (a CMakeCache.txt from another machine
        # makes CMake refuse to configure). Always start clean.
        run: rm -rf build
      - name: Install dependencies
        run: brew install cmake vulkan-headers vulkan-loader molten-vk glslang
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
