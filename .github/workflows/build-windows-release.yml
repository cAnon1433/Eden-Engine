name: Build & Release Eden (Windows)

# Manual trigger ONLY (the "Run workflow" button under the Actions tab
# on GitHub) - deliberately NOT on every push to main. The push-on-
# close prompt in Run Eden (Mac).command pushes to main quite casually
# (every session close, potentially several times a day, sometimes
# mid-work) - tying a full build + a new public Release to every one
# of those would spam the Releases page and occasionally publish a
# build made from an in-progress commit. Building only when explicitly
# asked for keeps a Release meaning "this is worth testers grabbing."
#
# If a fully automatic release-on-push-to-main ever becomes more
# useful than this, uncomment the "push" trigger below - the rest of
# the workflow doesn't need to change either way.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [ main ]

permissions:
  contents: write   # required to publish a Release with an attached asset

# actions/checkout, actions/upload-artifact, and softprops/action-gh-release
# below are pinned to their Node.js 24 runtime versions (v6/v6/v3) - GitHub
# is retiring Node 20 support for Actions runners in stages through late
# 2026, and staying on the old major versions produces a "Node.js 20 is
# deprecated" warning now and would eventually be a hard failure once
# Node 20 is fully removed from runners.
#
# One remaining Node-20-declared action is NOT fixable here:
# humbletim/install-vulkan-sdk@v1.2 uses actions/cache internally for its
# own SDK-download caching, pinned to an older version as an implementation
# detail of that third-party action - not something this workflow's pins
# can control. It's currently harmless (GitHub already runs it under
# Node 24 regardless, just with a warning) and will resolve itself once
# that action's maintainer updates it.

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # humbletim/install-vulkan-sdk installs the full Vulkan SDK and
      # exports VULKAN_SDK, which CMakeLists.txt's find_package(Vulkan
      # REQUIRED) picks up automatically - no extra CMake flags needed
      # on top of what already works locally.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      # Same generator/config as Package Eden for Testers (Windows).bat,
      # so a CI-built zip and a locally-packaged zip are the same shape.
      # No need to pass a static-CRT flag here - CMakeLists.txt already
      # sets CMAKE_MSVC_RUNTIME_LIBRARY globally, so this Release build
      # is self-contained (no VC++ redistributable needed by whoever
      # downloads it) without any CI-specific configuration.
      #
      # DELIBERATE DIVERGENCE from the local .bat scripts here: those
      # use the "Visual Studio 17 2022" CMake generator (a multi-config
      # generator, output lands in build/Release/) because it gives
      # Hawkins a real .sln to open and debug in the VS IDE locally.
      # On this runner, that exact generator failed with "could not
      # find any instance of Visual Studio" - a known, occasionally-
      # flaky vswhere-based detection issue in CMake's VS-generator
      # path, unrelated to whether Visual Studio is actually present
      # (windows-latest ships with VS 2022 preinstalled). The robust,
      # widely-used workaround - and what's used here - is to sidestep
      # that detection entirely: activate the MSVC developer
      # environment directly (ilammy/msvc-dev-cmd, i.e. vcvarsall.bat)
      # so cl.exe is just on PATH, then build with Ninja, a single-
      # config generator that has no VS-instance lookup of its own at
      # all. Nobody needs a .sln on this runner - it only ever produces
      # a zip - so losing that isn't a real loss here.
      #
      # Ninja is a SINGLE-config generator: output lands directly in
      # build/Eden.exe (NOT build/Release/Eden.exe like the VS
      # generator produces locally) - see the Package step below, which
      # is written for this layout, not the local scripts' layout.
      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          # Diagnostic first: if this still fails, the log will show
          # exactly what VULKAN_SDK actually resolved to (or that it's
          # empty/missing entirely) instead of leaving that a guess.
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"
          if ($env:VULKAN_SDK) { Get-ChildItem "$env:VULKAN_SDK" -ErrorAction SilentlyContinue }

          # Passing Vulkan_INCLUDE_DIR/Vulkan_LIBRARY explicitly rather
          # than relying on FindVulkan.cmake's own $ENV{VULKAN_SDK}
          # auto-detection, which is what actually failed last run
          # ("missing: Vulkan_LIBRARY Vulkan_INCLUDE_DIR") despite
          # VULKAN_SDK apparently being set - GitHub Actions runner
          # environment propagation across steps should make that env
          # var visible here regardless of the MSVC dev-environment
          # step in between, so rather than keep guessing why CMake's
          # own auto-detection isn't finding it, this hands CMake the
          # exact paths directly - correct as long as VULKAN_SDK points
          # at a standard-layout SDK install (Include/, Lib/), which
          # every official LunarG-distributed SDK does.
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DVulkan_INCLUDE_DIR="$env:VULKAN_SDK\Include" `
            -DVulkan_LIBRARY="$env:VULKAN_SDK\Lib\vulkan-1.lib"

      - name: Build
        run: cmake --build build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Eden-Windows | Out-Null
          # Explicit paths, not a wildcard "build/*" copy - Ninja's
          # single-config layout puts Eden.exe directly alongside CMake's
          # own build-system files (build.ninja, CMakeCache.txt,
          # CMakeFiles/, etc.) in the SAME directory, unlike the VS
          # generator's build/Release/ which only ever holds real output.
          # Listing exactly what a distributable needs avoids packaging
          # any of that build-system cruft into the zip.
          Copy-Item -Path "build/Eden.exe" -Destination "dist/Eden-Windows/"
          Copy-Item -Path "build/Shaders" -Destination "dist/Eden-Windows/Shaders" -Recurse
          Copy-Item -Path "build/Assets" -Destination "dist/Eden-Windows/Assets" -Recurse
          Compress-Archive -Path "dist/Eden-Windows/*" -DestinationPath "dist/Eden-Windows.zip" -Force

      # Also uploaded as a plain workflow artifact (visible under the
      # Actions run itself, expires after 90 days) as a lightweight
      # sanity-check path - the actual thing testers should be pointed
      # at is the Release created below, which doesn't expire.
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Eden-Windows
          path: dist/Eden-Windows.zip

      # Every run gets its own uniquely-tagged Release (build-<run
      # number>) rather than one shared "latest" tag that gets moved/
      # overwritten each time - avoids the extra tag-deletion step a
      # rolling release needs, and GitHub already marks whichever
      # Release is newest as "Latest" in its own UI, so there's no
      # extra step needed for someone landing on the Releases page to
      # find the current build. Older Releases just accumulate until
      # you delete them manually - a much simpler failure mode than a
      # rolling-tag update silently going wrong.
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "Eden - build ${{ github.run_number }}"
          files: dist/Eden-Windows.zip
          generate_release_notes: true
